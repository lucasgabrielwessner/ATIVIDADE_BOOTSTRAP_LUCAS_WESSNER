<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de Ordem de Serviço ou Agendamento</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body class="d-flex flex-column min-vh-100" style="background-color: #F0F7F4; color: #1A2E26;">

    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #0B3D2E; border-bottom: 3px solid #0E9F6E;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">DS • Bootstrap 5</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menuPortifolio" aria-controls="menuPortifolio" aria-expanded="false" aria-label="Alternar navegação">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="menuPortifolio">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="index.html">Início</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="desafio01.html">Desafio 01</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="desafio02.html">Desafio 02</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="desafio03.html">Desafio 03</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="desafio04.html">Desafio 04</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="desafio05.html">Desafio 05</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="flex-fill">
        <div class="container my-5" style="max-width: 700px;">
            <h2 class="text-center fw-bold mb-1">Cadastro de atendimento</h2>
            <p class="text-center mb-4" style="color: #6B7F76;">Clínica Viva Bem • Campo Largo</p>

            <div class="card border-0 shadow-sm rounded-4">
                <div class="card-body p-4">
                    <form>

                        <div class="row g-3">
                            <div class="col-12 col-md-6">
                                <label for="nome" class="form-label fw-semibold">Nome</label>
                                <input type="text" class="form-control" id="nome" placeholder="Seu nome" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="cpf" class="form-label fw-semibold">CPF</label>
                                <input type="text" class="form-control" id="cpf" placeholder="000.000.000-00" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="telefone" class="form-label fw-semibold">Telefone / WhatsApp</label>
                                <div class="input-group">
                                    <span class="input-group-text fw-bold" style="background-color: #0E9F6E; color: #FFFFFF; border-color: #0E9F6E;">+55</span>
                                    <input type="tel" class="form-control" id="telefone" placeholder="(41) 99999-9999" required>
                                </div>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="email" class="form-label fw-semibold">E-mail</label>
                                <input type="email" class="form-control" id="email" placeholder="voce@email.com" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="data" class="form-label fw-semibold">Data preferida</label>
                                <input type="date" class="form-control" id="data" required>
                            </div>

                            <div class="col-12 col-md-6">
                                <label for="servico" class="form-label fw-semibold">Tipo de serviço</label>
                                <select class="form-select" id="servico" required>
                                    <option value="" selected>Escolha o serviço</option>
                                    <option value="fisio">Fisioterapia</option>
                                    <option value="pilates">Pilates</option>
                                    <option value="avaliacao">Avaliação inicial</option>
                                    <option value="pos">Pós-operatório</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label for="valor" class="form-label fw-semibold">Valor estimado</label>
                                <div class="input-group">
                                    <span class="input-group-text fw-bold" style="background-color: #0E9F6E; color: #FFFFFF; border-color: #0E9F6E;">R$</span>
                                    <input type="text" class="form-control" id="valor" placeholder="0,00">
                                </div>
                            </div>
                        </div>

                        <div class="mt-3">
                            <label for="obs" class="form-label fw-semibold">Observações</label>
                            <textarea class="form-control" id="obs" rows="3" placeholder="O que você está sentindo e desde quando?"></textarea>
                        </div>

                        <div class="form-check mt-3">
                            <input class="form-check-input" type="checkbox" id="ciencia" required>
                            <label class="form-check-label" for="ciencia">Estou ciente que este é só um cadastro e que a clínica vai confirmar o horário.</label>
                        </div>

                        <div class="d-grid mt-4">
                            <button type="submit" class="btn btn-lg rounded-pill fw-bold" style="background-color: #0E9F6E; color: #FFFFFF;">Enviar cadastro</button>
                        </div>

                    </form>
                </div>
            </div>

            <p class="text-center mt-3 mb-0"><small style="color: #6B7F76;">Rua das Flores, 120, Centro • Segunda a sexta, 8h às 18h</small></p>
        </div>
    </main>

    <footer class="text-center py-3" style="background-color: #0B3D2E; color: #CBDCD4; border-top: 3px solid #0E9F6E;">
        <div class="container">
            <small>Curso Técnico em Desenvolvimento de Sistemas • SESI/SENAI Campo Largo</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
